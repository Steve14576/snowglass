<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>snowglass · 对象与真实灰度编辑</title>
<meta name="description" content="独立新版UX：左侧对象树与属性、右侧三维视口，按项继承、真实统计与可拖多点曲线。">
<link rel="stylesheet" href="assets/base.css"><link rel="stylesheet" href="assets/editor.css">
</head>
<body>
<header class="app-header">
  <div class="brand-block">
    <strong>snowglass</strong>
    <span class="version">独立 UX 版 · 已有真实统计</span>
  </div>
  <div class="file-actions" role="group" aria-label="文件">
    <button id="save-project">保存工程</button>
    <button id="open-project">打开工程</button>
    <button id="save-mapping">保存灰度映射</button>
    <input id="project-file" type="file" accept=".json" hidden>
  </div>
  <div class="header-spacer"></div>
  <div class="slice-actions" role="group" aria-label="切片">
    <button id="slice-1" class="slice-button" disabled title="首批未接入真实统计与网格重算">一级切片</button>
    <button id="slice-2" class="slice-button" disabled title="首批未接入厂家加工导出">二级导出</button>
  </div>
  <div class="header-actions" role="group" aria-label="编辑与查看">
    <button id="undo" title="Ctrl+Z">撤销</button>
    <button id="redo" title="Ctrl+Shift+Z">重做</button>
    <button id="report-toggle">后验报告</button>
    <button id="focus-toggle" title="F">专注</button>
  </div>
</header>
<main class="workspace">
<aside id="sidebar" aria-label="对象与属性">
  <section class="tree-panel">
    <div class="panel-heading"><h2>对象树</h2>
      <div class="mini-actions"><button id="new-box">＋长方体</button><button id="new-cylinder">＋圆柱</button></div>
    </div>
    <input id="tree-search" type="search" placeholder="查找对象、层号、张量" aria-label="查找对象">
    <div id="tree" role="tree" aria-label="操作对象树"></div>
    <div class="tree-actions">
      <button id="group">打组</button>
      <button id="ungroup">解组 · 继承</button>
      <button id="ungroup-keep">解组 · 保留局部</button>
      <button id="remove">删除</button>
    </div>
  </section>
  <div id="tree-splitter" role="separator" aria-orientation="horizontal" tabindex="0" aria-label="调整对象树与属性高度"></div>
  <section class="property-panel">
    <div class="panel-heading"><h2 id="property-title">对象属性</h2><span id="property-kind"></span></div>
    <div id="property-summary"></div>
    <div id="properties"></div>
  </section>
</aside>
<div id="sidebar-resizer" role="separator" aria-orientation="vertical" tabindex="0" aria-label="调整侧栏宽度"></div>
<section id="view" aria-label="三维工作区">
  <div id="boot-error" hidden role="alert">
    <h2 id="boot-title"></h2>
    <p id="boot-body"></p>
    <p id="boot-hint"></p>
    <p id="boot-cmd" class="boot-cmd"></p>
  </div>
  <div class="view-tools">
    <div class="tool-row">
      <button id="select-all">全选</button><button id="select-none">清空</button>
      <button id="box-select" title="Shift+拖动或在空白处拖出选框">框选 <kbd>Shift</kbd></button>
      <button data-mode="translate" title="W">移动</button>
      <button data-mode="rotate" title="E">旋转</button>
      <button data-mode="scale" title="R">缩放</button>
      <button data-mode="off" title="Q">关闭</button>
      <button id="fit-all">全景</button><button id="fit-selected">聚焦所选</button><button id="front-view">正面</button>
      <button id="isolate-view" title="只影响屏幕">隔离选区</button>
    </div>
    <div class="tool-row">
      <label>层号 <input id="layer-number" type="number" min="0" max="31" value="16"></label>
      <button id="select-layer">按层选</button>
      <select id="slot" aria-label="按功能列选择">
        <option value="mixer">序列混合</option><option value="ffn">FFN</option>
        <option value="norm1">Norm 1</option><option value="norm2">Norm 2</option><option value="vision">视觉塔</option>
      </select>
      <button id="select-column">按列选</button>
      <label>屏幕曝光 <input id="exposure" type="range" min=".25" max="2" step=".05" value="1"></label><output id="exposure-out">1.00</output>
    </div>
    <p class="key-hint">Shift 拖动框选 · Shift 单击范围选 · Ctrl 单击跳选 · Alt 单击选毛坯 · W/E/R 手柄</p>
  </div>
  <div id="marquee" hidden></div><div id="hover-card" hidden></div>
  <aside id="report" hidden aria-label="后验报告"></aside>
  <section id="identity" aria-label="选中对象身份" hidden></section>
  <div id="view-caption">载入已有缓存；未计算块不填模拟雪花。</div>
</section>
</main>
<footer class="statusbar"><span id="status" role="status">正在加载三维依赖与独立缓存……</span><span id="coverage"></span></footer>
<dialog id="confirm-dialog"><form method="dialog"><h2 id="confirm-title"></h2><pre id="confirm-body"></pre><div class="dialog-actions"><button value="cancel">取消</button><button id="confirm-ok" value="ok">确认</button></div></form></dialog>
<script src="assets/curve_math.js"></script><script src="assets/layout.js"></script><script src="assets/model.js"></script><script src="assets/data.js"></script><script src="assets/checks.js"></script><script src="assets/scene.js"></script><script src="assets/tree.js"></script><script src="assets/curve_ui.js"></script><script src="assets/inspector.js"></script><script src="assets/app.js"></script>
</body></html>
