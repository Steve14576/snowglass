<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#e6e6e6;

#app{position:fixed;left:320px;right:300px;top:0;bottom:0;background:hsl(var(--bg))}

  background:rgba(10,10,12,.9);box-shadow:0 12px 42px rgba(0,0,0,.5);backdrop-filter:blur(10px)}
#panel{top:0;left:0;bottom:0;width:310px;overflow:auto;padding:16px;border-radius:0;background:hsl(var(--panel))}

.sec-t{color:#8a8a90;font-size:10px;letter-spacing:.08em;margin-bottom:5px}

button,select,input[type=number]{padding:5px 8px;border:1px solid #3d3d42;border-radius:8px;background:#18181b;
  color:#ccc;font-family:inherit;font-size:11px;cursor:pointer}

  border-radius:20px;background:rgba(0,0,0,.72);border:1px solid rgba(255,180,84,.35);color:#ffb454;
  font-size:11px;pointer-events:none}

<body>
<div id="loading"><div id="loadmsg">正在加载 three.js 与拓扑数据……</div></div>
<div id="app"></div>
<section id="panel" class="card">
  <h1>snowglass · Qwen3.5-9B</h1>
  <div class="sub" id="configinfo">配置驱动架构 · 4.2 默认排布 · 1 单位＝1 mm。块内点仅为模拟，不作加工数据。</div>
  <div id="notice" role="status" aria-live="polite"></div>
  <div id="controls"></div>
</section>

<div id="boxselect"></div>
<button id="focus-view" aria-pressed="false">专注视图 F</button>

<script>
(function () {
"use strict";

const TOPO_URLS = ["data/qwen35_9b.topo.json", "../out/ir/qwen35_9b.topo.json", "../prototype/data/qwen35_9b.topo.json"];
const CDNS = ["https://cdn.jsdelivr.net/npm/three@0.128.0/", "https://unpkg.com/three@0.128.0/"];
const FILES = ["build/three.min.js", "examples/js/controls/OrbitControls.js", "examples/js/controls/TransformControls.js"];

function loadSeq(i, cdn, done, fail) {
  if (i >= FILES.length) return done();
  const s = document.createElement("script");
  s.src = CDNS[cdn] + FILES[i];
  s.onload = () => loadSeq(i + 1, cdn, done, fail);
  s.onerror = () => (cdn + 1 < CDNS.length ? loadSeq(i, cdn + 1, done, fail) : fail(FILES[i]));
  document.head.appendChild(s);
}
const msg = t => (document.getElementById("loadmsg").innerHTML = t);

loadSeq(0, 0, () => {
  // 依次尝试几个相对位置：从 8123（根=prototype/）和从 8124（根=项目根）都能打开
  (async () => {
    let last=null,tried=[],doc=null;
    for(const u of TOPO_URLS){tried.push(u);
      try{const r=await fetch(u,{cache:"no-store"});if(!r.ok){last=r.status;continue;}doc=await r.json();break;}
      catch(e){last=e.message;}
    }
    if(doc){try{start(doc);}catch(e){console.error(e);msg("编辑器初始化失败："+String(e.message).replace(/</g,"&lt;")+"<br>请检查配置或重新生成拓扑。此错误不是文件未找到。");}return;}
    msg("读不到拓扑文件：<br><code>"+tried.join("</code><br><code>")+"</code><br>最后结果："+last+
      "<br>请运行 scripts/build_topology_qwen35.py，生成 prototype/data/qwen35_9b.topo.json。");
  })();
}, f => msg("three.js 加载失败：" + f));

function start(topo) {
const THREE = window.THREE;

/* ============================================================
   参数（docs/decisions.md D9：外观 / 几何 / 数据 三类）
   ============================================================ */
const P = {
  // 外观：只影响屏幕
  showFrames: true, showShells: true, showSnow: true,
  labels: true, plate: false, colorByRole: false, autoRotate: false, displayPoints: 300000,
  pitch: 0.08, dotUm: 60, warnDensity: 0.10, speed: 4500,
  vision: true, scale: 1, squash: 0.55, depth: 6.2, widthMode: "equal", layerGap: 0,
  frameT: 0.04, shellT: 0.02, frameGray: 0.18, shellGray: 0.024,
  compress: 1, gamma: 2.4, floor: 0.03, adaptive: true, seed: 20261118,
  pointSize: 0.065, brightness: 1, grayDisplay: "brightness",
};
const DEFAULTS = JSON.parse(JSON.stringify(P));
const STORAGE_KEY = "snowglass.preweights.v2";
let manuals = {}, assembly = new THREE.Matrix4(), ghosts = [{id:"ghost-1",name:"参照毛坯 1",shape:"box",dims:[25,80,25],radius:12.5,height:80,margin:2.5,matrix:new THREE.Matrix4().toArray()}];
let primaryGhost = "ghost-1", selected = new Set(), gmMode = "off", boxMode = false, gesture = null, transformSession = null;
let dirtySnow = false, mockGeneration = 0;
const mockCache = new Map();

/* ============================================================
   场景
   ============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(42, 1, 0.05, 3000);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
document.getElementById("app").appendChild(renderer.domElement);
renderer.domElement.tabIndex=0;renderer.domElement.setAttribute("role","application");
renderer.domElement.setAttribute("aria-label","三维模型：单击选择、Shift加选、W移动、E旋转、R缩放");

function applyViewOffset() {
  const rect = document.getElementById("app").getBoundingClientRect();
  renderer.setSize(rect.width, rect.height); camera.aspect = rect.width / Math.max(1, rect.height);
  camera.clearViewOffset(); camera.updateProjectionMatrix();
}
applyViewOffset();

const orbit = new THREE.OrbitControls(camera, renderer.domElement);
orbit.enableDamping = true; orbit.dampingFactor = 0.08; orbit.autoRotateSpeed = 0.6;

const glass = new THREE.Group();   // 玻璃坐标系：毛坯中心为原点
scene.add(glass);
const model = new THREE.Group();   // 模型坐标系：gumball 作用在这里
glass.add(model);

const gumball = new THREE.TransformControls(camera, renderer.domElement);
gumball.setSize(0.8);
scene.add(gumball);
const pivot = new THREE.Object3D(); scene.add(pivot);
gumball.addEventListener("mouseDown", beginTransform);
gumball.addEventListener("dragging-changed", e => { orbit.enabled = !e.value && !boxMode; if (!e.value) onGumballEnd(); });
gumball.addEventListener("objectChange", applyTransform);

/* ============================================================
   工具
   ============================================================ */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const fmtInt = n => n >= 1e6 ? (n / 1e6).toFixed(2) + " M" : n >= 1e3 ? (n / 1e3).toFixed(1) + " k" : Math.round(n) + "";
const pct = v => (v * 100).toFixed(v < 0.1 ? 1 : 0) + " %";
const mm = v => v.toFixed(2) + " mm";
const ROLE_HUE = { embed: 196, lm_head: 203, norm: 325, attn_q: 272, attn_k: 264, attn_v: 255, attn_o: 246,
  gdn_q: 220, gdn_k: 212, gdn_v: 204, gdn_gate: 190, gdn_ctrl: 175, gdn_out: 232, mlp_gate: 34, mlp_up: 24,
  mlp_down: 14, vis_attn: 140, vis_mlp: 110, vis_patch: 160, vis_merger: 95, mtp: 0 };
function roleColor(role, light) {
  if (!P.colorByRole || ROLE_HUE[role] === undefined) return new THREE.Color(light, light, light);
  return new THREE.Color().setHSL(ROLE_HUE[role] / 360, 0.75, 0.25 + light * 0.45);
}

const blockById = Object.create(null);
topo.blocks.forEach(b => (blockById[b.id] = b));
if (topo.schema_version !== 2) throw new Error("拓扑版本过旧，请重新运行 build_topology_qwen35.py");
const RECIPE = Object.freeze({mixerStart:-9.2,mixerWidth:7.8,mixerGap:.28,ffnStart:.4,ffnWidth:9.6,ffnGap:.32,
  norm1X:-10.2,norm2X:-.55,normWidth:.65,headWidth:14,visionX:23.5});

/* ============================================================
   布局：只在这里实现一次（decisions.md 阶段计划）
   输出 solids：每个实体的轴对齐包围盒（模型坐标，毫米）
   ============================================================ */
let L = null;   // 当前布局结果

function groupWidths(total, items, gap) {
  const available = total - gap * (items.length - 1);
  const sum = items.reduce((n,b) => n + (b.params || 0), 0);
  return items.map(b => available * (P.widthMode === "params" && sum ? b.params / sum : 1 / items.length));
}
function boundsOf(solids) {
  const box = new THREE.Box3(); solids.forEach(s => s.corners.forEach(v => box.expandByPoint(v)));
  return box;
}

function layout() {
  const solids = [], labels = [], warns = [], slots = [];
  const c = topo.model, sq = P.squash, fix = c.n_layers > 45 ? .72 : 1;
  const h = .72 * sq * fix, pitch = 1.17 * sq * fix, H = c.n_layers * pitch, depth = P.depth;
  const global = assembly.clone().multiply(new THREE.Matrix4().makeScale(P.scale,P.scale,P.scale));
  function add(b, center, dims, kind = "block") {
    if (!b) return;
    const size = dims.map((v,i) => Math.max(.0001, v - (i < 2 ? P.layerGap : 0)));
    if (dims[0] <= P.layerGap || dims[1] <= P.layerGap) warns.push(b.id + " 间隙已大于块尺寸，仅保留最小数学厚度");
    const anchor = global.clone().multiply(new THREE.Matrix4().makeTranslation(...center));
    const matrix = anchor.clone().multiply(new THREE.Matrix4().fromArray(manuals[b.id] || new THREE.Matrix4().toArray()))
      .multiply(new THREE.Matrix4().makeScale(...size));
    const corners = []; for (const x of [-.5,.5]) for (const y of [-.5,.5]) for (const z of [-.5,.5])
      corners.push(new THREE.Vector3(x,y,z).applyMatrix4(matrix));
    const box = new THREE.Box3().setFromPoints(corners), lengths = [0,1,2].map(i => new THREE.Vector3().setFromMatrixColumn(matrix,i).length());
    solids.push({id:b.id,kind,block:b,role:b.role,slot:{center: center.slice(),size:dims.slice()},size:lengths,
      localSize:size,anchor,matrix,corners,box,center:new THREE.Vector3().setFromMatrixPosition(matrix),
      x0:box.min.x,x1:box.max.x,y0:box.min.y,y1:box.max.y,z0:box.min.z,z1:box.max.z});
    slots.push({corners:corners.map(v=>v.clone())});
  }
  function group(items,start,width,gap,y) {
    items.sort((a,b)=>a.order-b.order); let cursor = start;
    groupWidths(width,items,gap).forEach((w,i)=>{add(items[i],[cursor+w/2,y,0],[w,h,depth]);cursor += w+gap;});
  }
  const headH = Math.max(1.4,2.5*sq);
  add(blockById.embed,[0,-H/2-headH/2-1.2,0],[14,headH,depth*1.15]);
  labels.push({text:"Token Embedding",x:0,y:-H/2-headH-2.2});
  for (let i=0;i<c.n_layers;i++) {
    const y = -H/2+(i+.5)*pitch, items = topo.blocks.filter(b=>b.layer===i);
    add(items.find(b=>b.slot==="norm1"),[-10.2,y,0],[.65,h,depth*.6]);
    group(items.filter(b=>b.slot==="mixer"),RECIPE.mixerStart,RECIPE.mixerWidth,RECIPE.mixerGap,y);
    add(items.find(b=>b.slot==="norm2"),[-.55,y,0],[.65,h,depth*.6]);
    group(items.filter(b=>b.slot==="ffn"),RECIPE.ffnStart,RECIPE.ffnWidth,RECIPE.ffnGap,y);
    if(i%(c.n_layers>45?8:4)===0||i===c.n_layers-1||topo.layers[i].kind==="full")
      labels.push({text:"L"+i+" · "+(topo.layers[i].kind==="full"?"Full":"GDN"),x:-14.1,y});
  }
  add(blockById.final_norm,[0,H/2+.85,0],[6.5,Math.max(.4,.6*sq),depth*.6]);
  add(blockById.lm_head,[0,H/2+headH/2+1.8,0],[14,headH,depth*1.15]);
  labels.push({text:"LM Head",x:0,y:H/2+headH+2.8});
  if(topo.geometry_only.some(b=>b.id==="mtp")) add({id:"mtp",role:"mtp",label:"MTP · 权重未收录",tensors:[],params:0},
    [10.5,H/2+headH/2+1.8,0],[4.2,headH*.85,depth*.9],"mtp");
  if(P.vision&&c.vision_layers) {
    const x=RECIPE.visionX, vp=Math.max(.65,H*.85/c.vision_layers), vh=vp*.62, span=c.vision_layers*vp;
    add(blockById["V.patch"],[x,-span/2-1.4,0],[8.2,Math.max(1.1,1.7*sq),depth*.9]);
    add(blockById["V.merger"],[x,span/2+1.5,0],[8.5,Math.max(1.2,1.9*sq),depth*.95]);
    for(let i=0;i<c.vision_layers;i++) {
      const y=-span/2+(i+.5)*vp, tag="V"+String(i).padStart(2,"0");
      [["norm1",-4.5,.45,.5],["attn",-2.1,3.6,.85],["norm2",.3,.45,.5],["mlp",2.9,4,.85]].forEach(([slot,dx,w,d])=>
        add(blockById[tag+"."+slot],[x+dx,y,0],[w,vh,depth*d]));
      if(i%6===0||i===c.vision_layers-1) labels.push({text:"V"+i,x:x+6.4,y});
    }
    labels.push({text:"Vision Patch",x,y:-span/2-2.9},{text:"Merger / Projector",x,y:span/2+3.2});
  }
  // 槽位尺度独立于间隙；实际外沿可内缩，不推动邻居或改层节距。
  const slotBounds = new THREE.Box3(); solids.forEach(s=>{
    const slotM=s.anchor.clone().multiply(new THREE.Matrix4().makeScale(...s.slot.size));
    for(const x of [-.5,.5])for(const y of [-.5,.5])for(const z of [-.5,.5])slotBounds.expandByPoint(new THREE.Vector3(x,y,z).applyMatrix4(slotM));
  });
  return {solids,labels,warns,H,pitch,bounds:boundsOf(solids),slotBounds,overlaps:[]};
}

/* ============================================================
   几何量：框与壳的有效厚度（块太小会被收窄）、每块的内部体积
   与点数无关，只由毫米尺寸和两个厚度参数决定
   ============================================================ */
function prepare() {
  let clamped = 0;
  L.solids.forEach(s => {
    const [lx,ly,lz] = s.size, mn = Math.min(lx,ly,lz);
    const t = Math.min(P.frameT, mn / 2), sh = Math.min(P.shellT, mn / 2);
    if (t < P.frameT - 1e-9 || sh < P.shellT - 1e-9) clamped++;
    s.tEff = t; s.sEff = sh;
    const inner = Math.max(lx - 2 * sh, 0) * Math.max(ly - 2 * sh, 0) * Math.max(lz - 2 * sh, 0);
    s.interior = s.kind === "block" ? inner : 0;
  });
  L.clamped = clamped;
}

/* ============================================================
   后验报告（decisions.md D2）
   点数不是限额：网格由几何定，每格放不放点由灰度定，总数是结果。
   这里只统计并报出来，不改任何生成逻辑，也没有可以“用完”的预算。
   ============================================================ */
function report() {
  let frame=0,shell=0,params=0,mockCount=0;
  L.solids.forEach(s=>{
    const [x,y,z]=s.size,t=s.tEff,sh=s.sEff;
    const fv=4*t*t*(x+y+z-4*t), inner=[x-2*sh,y-2*sh,z-2*sh];
    const sv=s.kind==="mtp"?0:x*y*z-inner.reduce((a,b)=>a*b,1);
    const core=t>sh?4*(t-sh)**2*(inner.reduce((a,b)=>a+b,0)-4*(t-sh)):0;
    const ov=s.kind==="mtp"?0:Math.max(0,fv-core);
    const determinant=Math.abs(s.matrix.determinant())/(x*y*z);
    frame+=((fv-ov)*P.frameGray+ov*Math.max(P.frameGray,P.shellGray))*determinant/P.pitch**3;
    shell+=(sv-ov)*P.shellGray*determinant/P.pitch**3;
    params+=s.block.params||0; mockCount+=mockCache.get(s.id)?.count||0;
  });
  const g=ghosts.find(g=>g.id===primaryGhost), volume=g?ghostVolume(g):0;
  return {frame,shell,total:frame+shell,minutes:(frame+shell)/P.speed/60,
    params,mockCount,referenceOuterVolumeMM3:volume,clamped:L.clamped,realSnowLoaded:false};
}

/* ============================================================
   绘制：框（12 根方梁）与包络面（6 块薄板）都是有毫米厚度的实体
   ============================================================ */
const unitBox = new THREE.BoxGeometry(1, 1, 1);
const MAXI = topo.blocks.length + topo.geometry_only.length;
const frameMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, depthWrite: false });
const shellMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, depthWrite: false, side: THREE.DoubleSide });
const frames = new THREE.InstancedMesh(unitBox, frameMat, MAXI * 12);
const shells = new THREE.InstancedMesh(unitBox, shellMat, MAXI * 6);
const proxies = new THREE.InstancedMesh(unitBox, new THREE.MeshBasicMaterial({ visible: false }), MAXI);
[frames, shells, proxies].forEach(m => { m.frustumCulled = false; model.add(m); });
for (let i = 0; i < MAXI * 12; i++) frames.setColorAt(i, new THREE.Color(1, 1, 1));
for (let i = 0; i < MAXI * 6; i++) shells.setColorAt(i, new THREE.Color(1, 1, 1));
const unitEdges = new THREE.EdgesGeometry(unitBox);
const selectionGroup = new THREE.Group(); scene.add(selectionGroup);
const selectionMat = new THREE.LineBasicMaterial({color:0x65c6fa,transparent:true,opacity:.9});
const warningMat = new THREE.LineBasicMaterial({color:0xff7070,transparent:true,opacity:.22});
const hl = new THREE.LineSegments(unitEdges, new THREE.LineBasicMaterial({ color: 0x6fd3ff }));
hl.visible = false; model.add(hl);

function drawStructure() {
  let fi=0,si=0;
  L.solids.forEach((s,idx)=>{
    const [x,y,z]=s.size,t=s.tEff,sh=s.sEff,col=roleColor(s.role,1);
    proxies.setMatrixAt(idx,s.matrix);s.pid=idx;
    const basis=s.matrix.clone().multiply(new THREE.Matrix4().makeScale(1/x,1/y,1/z));
    const piece=(mesh,index,center,size)=>{
      mesh.setMatrixAt(index,basis.clone().multiply(new THREE.Matrix4().makeTranslation(...center)).multiply(new THREE.Matrix4().makeScale(...size)));
      mesh.setColorAt(index,col);
    };
    for(const yy of [-y/2+t/2,y/2-t/2])for(const zz of [-z/2+t/2,z/2-t/2])piece(frames,fi++,[0,yy,zz],[x,t,t]);
    for(const xx of [-x/2+t/2,x/2-t/2])for(const zz of [-z/2+t/2,z/2-t/2])piece(frames,fi++,[xx,0,zz],[t,y-2*t,t]);
    for(const xx of [-x/2+t/2,x/2-t/2])for(const yy of [-y/2+t/2,y/2-t/2])piece(frames,fi++,[xx,yy,0],[t,t,z-2*t]);
    if(s.kind==="mtp")return;
    for(const yy of [-y/2+sh/2,y/2-sh/2])piece(shells,si++,[0,yy,0],[x,sh,z]);
    for(const zz of [-z/2+sh/2,z/2-sh/2])piece(shells,si++,[0,0,zz],[x,y-2*sh,sh]);
    for(const xx of [-x/2+sh/2,x/2-sh/2])piece(shells,si++,[xx,0,0],[sh,y-2*sh,z-2*sh]);
  });
  frames.count=fi;shells.count=si;proxies.count=L.solids.length;
  [frames,shells,proxies].forEach(m=>{m.instanceMatrix.needsUpdate=true;if(m.instanceColor)m.instanceColor.needsUpdate=true;});
  drawSelection();applyAppearance();
}

  uniforms:{pointSize:{value:P.pointSize},brightness:{value:1},sizeMode:{value:0},pixelScale:{value:400}},
  vertexShader:"attribute vec3 color; varying vec3 vColor; uniform float pointSize,pixelScale,sizeMode,brightness; void main(){vec4 mv=modelViewMatrix*vec4(position,1.0); float g=max(color.r,max(color.g,color.b)); vColor=color*brightness; gl_PointSize=max(.01,pointSize*pixelScale*(sizeMode>.5?.35+g:1.0)/max(.01,-mv.z)); gl_Position=projectionMatrix*mv;}",

let mockSeed=P.seed,mockCounts={};
function ensureMock(s) {
  if(mockCache.has(s.id)||s.kind==="mtp")return;
  const count=mockCounts[s.id]??Math.round(Math.min(1800,Math.max(95,s.slot.size.reduce((a,b)=>a*b,1)*85)));
  mockCounts[s.id]=count;
  const r=mulberry32(hash(topo.model.name+"|"+s.id)^mockSeed),data=new Float32Array(count*4);
  for(let i=0;i<count;i++){
    for(let j=0;j<3;j++)data[i*4+j]=(r()-.5)*.96;
    data[i*4+3]=r()<.16?.48+r()*.52:.05+r()*.14;
  }
  mockCache.set(s.id,{count,data});
}
function buildSnow() {
  // 固定块内坐标缓存。重布局只映射到新空间；显示点数是抽样上限，不生成“剩余配额”。
  L.solids.forEach(ensureMock);
  const total=L.solids.reduce((n,s)=>n+(mockCache.get(s.id)?.count||0),0),ratio=Math.min(1,P.displayPoints/Math.max(1,total));
  let n=0;const v=new THREE.Vector3();
  L.solids.forEach(s=>{
    const m=mockCache.get(s.id);if(!m)return;
    const count=Math.floor(m.count*ratio);
    for(let j=0;j<count&&n<MAXP;j++){
      const i=Math.floor(j*m.count/count),a=i*4,g=m.data[a+3];
      v.set(m.data[a],m.data[a+1],m.data[a+2]).applyMatrix4(s.matrix);
      sPos.set([v.x,v.y,v.z],n*3);const color=roleColor(s.role,g);sCol.set([color.r,color.g,color.b],n*3);n++;
    }
  });
  snowGeo.setDrawRange(0,n);snowGeo.attributes.position.needsUpdate=true;snowGeo.attributes.color.needsUpdate=true;
  L.displayed=n;snowPts.material.uniforms.pixelScale.value=renderer.domElement.height/2;
}

function textSprite(text, h, color) {
  const c = document.createElement("canvas"), ctx = c.getContext("2d"), fs = 44;
  ctx.font = "500 " + fs + "px system-ui,'Microsoft YaHei'";
  c.width = Math.ceil(ctx.measureText(text).width) + 16; c.height = fs + 16;
  ctx.font = "500 " + fs + "px system-ui,'Microsoft YaHei'";
  ctx.fillStyle = color || "rgba(220,220,225,0.85)"; ctx.textBaseline = "middle"; ctx.fillText(text, 8, c.height / 2);
  const tex = new THREE.CanvasTexture(c); tex.minFilter = THREE.LinearFilter;

function disposeTree(o) {

let ghostHitObjects=[];
function selectedGhost(){const key=[...selected].find(id=>id.startsWith("ghost:"));return ghosts.find(g=>g.id===key?.slice(6));}
function ghostVolume(g){return (g.shape==="box"?g.dims.reduce((a,b)=>a*b,1):Math.PI*g.radius**2*g.height)*Math.abs(new THREE.Matrix4().fromArray(g.matrix).determinant());}
function ghostInset(g){
  const inv=new THREE.Matrix4().fromArray(g.matrix).invert(),a=inv.elements;
  const rows=[0,1,2].map(i=>new THREE.Vector3(a[i],a[i+4],a[i+8]));
  const A=rows[0].lengthSq(),C=rows[2].lengthSq(),B=rows[0].dot(rows[2]);
  const radial=Math.sqrt((A+C+Math.sqrt((A-C)**2+4*B*B))/2);
  return {inv,dims:g.dims.map((v,i)=>v-2*g.margin*rows[i].length()),radius:g.radius-g.margin*radial,
    height:g.height-2*g.margin*rows[1].length(),approx:g.shape==="cylinder"&&(Math.abs(A-C)>1e-6||Math.abs(B)>1e-6)};
}
function drawBlank(){
  while(blankGroup.children.length){const o=blankGroup.children[0];blankGroup.remove(o);disposeTree(o);}ghostHitObjects=[];
  ghosts.forEach(g=>{
    const inset=ghostInset(g),group=new THREE.Group();group.matrixAutoUpdate=false;group.matrix.fromArray(g.matrix);blankGroup.add(group);
    function shape(inner){
      if(g.shape==="box"){const dims=inner?inset.dims:g.dims;return dims.some(x=>x<=0)?null:new THREE.BoxGeometry(...dims);}
      const r=inner?inset.radius:g.radius,h=inner?inset.height:g.height;
      return r<=0||h<=0?null:new THREE.CylinderGeometry(r,r,h,48);
    }
    for(const inner of [false,true]){
      const geo=shape(inner);if(!geo)continue;
      const mat=inner?new THREE.LineDashedMaterial({color:0x777c85,transparent:true,opacity:.35,dashSize:.6,gapSize:.4}):
        new THREE.LineBasicMaterial({color:selected.has("ghost:"+g.id)?0x65c6fa:0x9a9ea6,transparent:true,opacity:.45});
      const line=new THREE.LineSegments(new THREE.EdgesGeometry(geo),mat);if(inner)line.computeLineDistances();group.add(line);
      if(!inner){const hit=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({transparent:true,opacity:.002,depthWrite:false,side:THREE.DoubleSide}));
        hit.userData.ghostId=g.id;group.add(hit);ghostHitObjects.push(hit);}else geo.dispose();
    }

}

/* ============================================================
   包含检查（经过 gumball 变换后，所有实体必须在可雕区内）
   ============================================================ */
let outside = 0;
function overlapsExact(a,b){
  if(a.box.max.x<=b.box.min.x+1e-6||b.box.max.x<=a.box.min.x+1e-6||a.box.max.y<=b.box.min.y+1e-6||b.box.max.y<=a.box.min.y+1e-6||a.box.max.z<=b.box.min.z+1e-6||b.box.max.z<=a.box.min.z+1e-6)return false;
  const edges=s=>[0,1,2].map(i=>new THREE.Vector3().setFromMatrixColumn(s.matrix,i));
  const A=edges(a),B=edges(b),normals=e=>[e[0].clone().cross(e[1]),e[1].clone().cross(e[2]),e[2].clone().cross(e[0])];
  const axes=[...normals(A),...normals(B),...A.flatMap(x=>B.map(y=>x.clone().cross(y)))];
  for(const axis of axes){if(axis.lengthSq()<1e-15)continue;axis.normalize();
    const p=a.corners.map(v=>v.dot(axis)),q=b.corners.map(v=>v.dot(axis));
    if(Math.max(...p)<=Math.min(...q)+1e-6||Math.max(...q)<=Math.min(...p)+1e-6)return false;
  }return true;
}
function checkContainment(){
  if(!L)return;outside=0;L.solids.forEach(s=>s.outside=false);
  ghosts.forEach(g=>{
    const inset=ghostInset(g);g.invalidInset=g.shape==="box"?inset.dims.some(v=>v<=0):inset.radius<=0||inset.height<=0;g.outsideCount=0;
    L.solids.forEach(s=>{const out=g.invalidInset||s.corners.some(c=>{
      const v=c.clone().applyMatrix4(inset.inv);
      return g.shape==="box"?v.toArray().some((x,i)=>Math.abs(x)>inset.dims[i]/2+1e-6):Math.hypot(v.x,v.z)>inset.radius+1e-6||Math.abs(v.y)>inset.height/2+1e-6;
    });if(out){g.outsideCount++;s.outside=true;}});
  });outside=L.solids.filter(s=>s.outside).length;
  L.overlaps=[];for(let i=0;i<L.solids.length;i++)for(let j=i+1;j<L.solids.length;j++)
    if(overlapsExact(L.solids[i],L.solids[j]))L.overlaps.push([L.solids[i].id,L.solids[j].id]);
}

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let hoverDirty=false;
function pointerMouse(e){const r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);hoverDirty=true;}
function pick(e){pointerMouse(e);scene.updateMatrixWorld(true);ray.setFromCamera(mouse,camera);
  if(e.altKey){const hit=ray.intersectObjects(ghostHitObjects,false)[0];return hit?"ghost:"+hit.object.userData.ghostId:null;}
  const hit=ray.intersectObject(proxies,false)[0];return hit?L.solids[hit.instanceId]?.id:null;

renderer.domElement.addEventListener("pointerdown",e=>{
  if(e.button!==0||gumball.dragging||(gumball.axis&&gmMode!=="off"&&!boxMode))return;
  gesture={x:e.clientX,y:e.clientY,box:boxMode||e.shiftKey,add:e.shiftKey,id:e.pointerId};
  if(gesture.box){e.stopImmediatePropagation();orbit.enabled=false;renderer.domElement.setPointerCapture(e.pointerId);}

renderer.domElement.addEventListener("pointermove",e=>{
  pointerMouse(e);if(!gesture?.box)return;e.stopImmediatePropagation();
  const rect=document.getElementById("boxselect");rect.style.display="block";
  rect.style.left=Math.min(gesture.x,e.clientX)+"px";rect.style.top=Math.min(gesture.y,e.clientY)+"px";
  rect.style.width=Math.abs(gesture.x-e.clientX)+"px";rect.style.height=Math.abs(gesture.y-e.clientY)+"px";
},true);
renderer.domElement.addEventListener("pointerup",e=>{
  if(!gesture)return;const g=gesture;gesture=null;document.getElementById("boxselect").style.display="none";
  orbit.enabled=!boxMode;if(g.box)e.stopImmediatePropagation();
  if(Math.hypot(e.clientX-g.x,e.clientY-g.y)<5){const id=pick(e);selectIds(id?[id]:[],g.add);return;}
  if(!g.box)return;
  const r=renderer.domElement.getBoundingClientRect(),x0=Math.min(g.x,e.clientX),x1=Math.max(g.x,e.clientX),y0=Math.min(g.y,e.clientY),y1=Math.max(g.y,e.clientY);
  camera.updateMatrixWorld(true);
  const ids=L.solids.filter(s=>{const p=s.corners.map(v=>v.clone().project(camera));if(p.every(v=>v.z>1||v.z<-1))return false;
    const xs=p.map(v=>r.left+(v.x+1)*r.width/2),ys=p.map(v=>r.top+(1-v.y)*r.height/2);
    return Math.max(...xs)>=x0&&Math.min(...xs)<=x1&&Math.max(...ys)>=y0&&Math.min(...ys)<=y1;
  }).map(s=>s.id);selectIds(ids,g.add);
},true);

function checkedMatrix(a){if(!Array.isArray(a)||a.length!==16||a.some(x=>typeof x!=="number"||!Number.isFinite(x)))throw new Error("变换矩阵无效");
  const m=new THREE.Matrix4().fromArray(a);if(Math.abs(m.determinant())<1e-12||Math.abs(a[3])+Math.abs(a[7])+Math.abs(a[11])>1e-8||Math.abs(a[15]-1)>1e-8)throw new Error("只支持非退化仿射变换");return m;}
function validateProject(doc){
  if(doc.schema_version!==2||doc.kind!=="snowglass.preweights")throw new Error("不是本版 snowglass 工程");
  if(doc.topology_id!==topo.topology_id)throw new Error("拓扑或源配置已改变，不能把旧工程静默套到新分组");
  const p={...DEFAULTS};for(const k of Object.keys(DEFAULTS)){if(!(k in doc.params))continue;const value=doc.params[k];
    if(typeof value!==typeof DEFAULTS[k]||(typeof value==="number"&&!Number.isFinite(value)))throw new Error("参数类型无效："+k);p[k]=value;}
  for(const k of ["scale","squash","depth","pitch","speed","pointSize","compress","gamma"])if(p[k]<=0)throw new Error("参数必须为正："+k);
  for(const k of ["frameT","shellT","brightness","dotUm"])if(p[k]<0)throw new Error("参数不能为负："+k);
  for(const k of ["frameGray","shellGray","floor","warnDensity"])if(p[k]<0||p[k]>1)throw new Error("灰度或参考值须在0–1之间");
  if(!["equal","params"].includes(p.widthMode)||!["brightness","size"].includes(p.grayDisplay))throw new Error("布局或显示模式无效");
  const delta={};for(const [id,a] of Object.entries(doc.manuals||{})){if(!blockById[id]&&id!=="mtp")throw new Error("未知块："+id);delta[id]=checkedMatrix(a).toArray();}
  const gs=doc.ghosts;if(!Array.isArray(gs)||gs.length>100)throw new Error("毛坯列表无效");const ids=new Set();
  gs.forEach(g=>{if(typeof g.id!=="string"||ids.has(g.id)||typeof g.name!=="string"||g.name.length>200||!["box","cylinder"].includes(g.shape))throw new Error("毛坯身份无效");ids.add(g.id);
    if(!Array.isArray(g.dims)||g.dims.length!==3||[...g.dims,g.radius,g.height].some(x=>!Number.isFinite(x)||x<=0)||!Number.isFinite(g.margin)||g.margin<0)throw new Error("毛坯尺寸无效");checkedMatrix(g.matrix);});
  if(doc.primaryGhost!==null&&!ids.has(doc.primaryGhost))throw new Error("主参照不存在");checkedMatrix(doc.assembly);
  if(!Number.isFinite(doc.mock?.seed))throw new Error("模拟种子无效");
  for(const [id,n] of Object.entries(doc.mock.counts||{}))if(!blockById[id]||!Number.isInteger(n)||n<0||n>1800)throw new Error("模拟样本记录无效");
  if(doc.camera)for(const a of [doc.camera.position,doc.camera.target])if(!Array.isArray(a)||a.length!==3||a.some(x=>!Number.isFinite(x)))throw new Error("视角无效");
  return {p,delta,gs:JSON.parse(JSON.stringify(gs))};
}

  mockSeed=doc.mock.seed;mockCounts={...doc.mock.counts};mockGeneration=doc.mock.generation||0;mockCache.clear();dirtySnow=!!doc.dirtySnow;
  selected.clear();transformSession=null;schedule("all");flush();renderGhostPanel();
  if(doc.camera){camera.position.fromArray(doc.camera.position);orbit.target.fromArray(doc.camera.target);orbit.update();}else fitView();saveSoon();
}
function resetProject(){Object.assign(P,DEFAULTS);manuals={};assembly.identity();ghosts=[{id:"ghost-1",name:"参照毛坯 1",shape:"box",dims:[25,80,25],radius:12.5,height:80,margin:2.5,matrix:new THREE.Matrix4().toArray()}];
  primaryGhost="ghost-1";selected.clear();mockCache.clear();mockCounts={};mockSeed=P.seed;mockGeneration++;dirtySnow=false;transformSession=null;boxMode=false;orbit.enabled=true;gumball.enabled=true;setGumball("off");
    const boxButton=document.getElementById("box-select-toggle");boxButton.classList.remove("on");boxButton.setAttribute("aria-pressed","false");
  schedule("all");flush();renderGhostPanel();fitView();saveSoon();notice("已恢复默认排布与参照对象");}

/* ============================================================
   更新调度：all（重排）> struct（结构）> snow（映射固定样本）> meter > view
   ============================================================ */
const RANK = { view: 0, meter: 1, snow: 2, struct: 3, all: 4 };
let pending=-1,flushTimer=null;
function schedule(level){pending=Math.max(pending,RANK[level]??4);if(!flushTimer)flushTimer=setTimeout(()=>{flushTimer=null;flush();},16);}
function flush(){
  if(pending<0)return;const lv=pending;pending=-1;const hoverId=hoveredSolid?.id;
  if(lv>=4){L=layout();selected=new Set([...selected].filter(id=>id.startsWith("ghost:")?ghosts.some(g=>"ghost:"+g.id===id):L.solids.some(s=>s.id===id)));drawBlank();drawLabels();drawPlate();}
  if(lv>=3){prepare();checkContainment();drawStructure();}
  if(lv>=2)buildSnow();
  if(lv>=1){L.ink=report();checkContainment();drawSelection();renderMeter();}
  syncControls();applyAppearance();syncPivot();renderGumballInfo();
  if(hoverId)hoverInfo(L.solids.find(s=>s.id===hoverId)||null);else if(lv>=4)hoverInfo(null);
}
buildPanel();schedule("all");flush();fitView();
try{const saved=localStorage.getItem(STORAGE_KEY);if(saved){restoreProject(JSON.parse(saved));notice("已恢复本地工程");}}catch(e){notice("本地工程未恢复："+e.message);}
document.getElementById("configinfo").textContent="4.2 默认排布 · 1 单位＝1 mm · config SHA "+topo.config.sha256.slice(0,12)+" · 清单覆盖 "+topo.coverage.text_tensors+" + "+topo.coverage.vision_tensors;
// 同一套接口供工程检查与浏览器控制台复现，不另写第二套布局算法。
document.getElementById("loading").remove();
document.getElementById("focus-view").onclick=toggleFocus;
window.snowglass={getLayout:()=>{flush();return layoutData();},getProject:captureProject,restoreProject,resetProject,
  select:selectIds,setParam:changeParam,resizeSelection,newGhost,deleteGhost,flush,fitView,
  mockDigest:id=>{const m=mockCache.get(id);if(!m)return null;let h=0;for(let i=0;i<m.data.length;i++)h=(Math.imul(h,31)+Math.round(m.data[i]*1e6))|0;return {count:m.count,hash:h};},
  projectSelection:()=>[...selected],projectScreen:id=>{const s=L.solids.find(s=>s.id===id),r=renderer.domElement.getBoundingClientRect();if(!s)return null;const v=s.center.clone().project(camera);return {x:r.left+(v.x+1)*r.width/2,y:r.top+(1-v.y)*r.height/2};}};
addEventListener("resize",()=>{applyViewOffset();buildSnow();fitView();});
addEventListener("beforeunload",()=>{try{localStorage.setItem(STORAGE_KEY,JSON.stringify(captureProject()));}catch(e){console.warn("工程自动保存失败",e);}});
(function loop(){requestAnimationFrame(loop);flush();updateHover();orbit.update();renderer.render(scene,camera);})();
}
})();
</script>
